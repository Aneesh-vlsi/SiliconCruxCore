name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev libffi7
        sudo apt-get install -y openjdk-17-jdk-headless autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libssl-dev libffi-dev maven python3-pip python3-setuptools
        sudo apt-get install -y lld g++-multilib
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" virtualenv buildozer

    - name: Run Buildozer Engine
      run: |
        # Run straight into the debug compilation loop safely
        yes | buildozer android debug

    - name: Export APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SiliconCruxCore-APK
        path: bin/*.apk
